@if (isAuthenticated()) {
  <div class="app-shell">
    <header class="shell-header">
      <div class="shell-brand">
        <img src="/assets/brand/logo-fmcpa.webp" alt="FMCPA" class="shell-logo" />
        <div class="shell-heading">
          <h1>FMCPA Platform</h1>
          <p>Gestión operativa</p>
        </div>
      </div>

      @if (currentUser()) {
        <div class="user-menu" (click)="keepUserMenuOpen($event)">
          <button
            type="button"
            class="user-menu-trigger"
            aria-haspopup="menu"
            [attr.aria-expanded]="isUserMenuOpen()"
            (click)="toggleUserMenu($event)">
            <span class="user-avatar" aria-hidden="true">{{ currentUserInitials() }}</span>
            <span class="user-name">{{ currentUserDisplayName() }}</span>
            <span class="user-caret" aria-hidden="true">⌄</span>
          </button>

          @if (isUserMenuOpen()) {
            <div class="user-menu-panel" role="menu" aria-label="Cuenta de usuario">
              <a routerLink="/account/password" role="menuitem" (click)="closeUserMenuFromAction()">
                Cambiar contraseña
              </a>
              <button type="button" role="menuitem" (click)="logout()">Cerrar sesión</button>
            </div>
          }
        </div>
      }
    </header>

    <div class="shell-main">
      <nav class="shell-nav" aria-label="Navegación principal">
        @for (group of visibleNavigationGroups(); track group.id) {
          <section class="shell-nav-group" [attr.aria-labelledby]="group.id + '-heading'">
            <h2 class="shell-nav-heading" [id]="group.id + '-heading'">{{ group.label }}</h2>

            <div class="shell-nav-links">
              @for (item of group.items; track item.path) {
                <a
                  [routerLink]="item.path"
                  routerLinkActive="is-active"
                  [routerLinkActiveOptions]="{ exact: item.exact ?? false }">
                  {{ item.label }}
                </a>
              }
            </div>
          </section>
        }
      </nav>

      <main class="shell-content">
        <router-outlet />
      </main>
    </div>
  </div>
} @else {
  <router-outlet />
}
